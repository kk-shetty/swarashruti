[project]
name = "swarashruti"
version = "0.1.0"
description = "Convert hummed audio to instrument playback"
authors = [{name = "Karthik K Shetty", email = "shetty.karthik1857@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.4.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[[tool.uv.index]]
url = "https://pypi.org/simple/"


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "scipy>=1.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
